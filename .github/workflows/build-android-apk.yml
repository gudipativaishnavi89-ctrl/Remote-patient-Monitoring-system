name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      buildType:
        description: 'Build Type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build-apk:
    name: Build Android APK (Capacitor)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          npm install

      - name: Build Web Application
        run: |
          npx vite build

      - name: Initialize and Sync Capacitor Android
        run: |
          # Add android platform if not present and sync build assets
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Grant Execute Permission to Gradle
        run: |
          chmod +x android/gradlew

      - name: Build Android Debug APK
        if: "${{ github.event.inputs.buildType != 'release' }}"
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Build Android Release APK (Unsigned)
        if: "${{ github.event.inputs.buildType == 'release' }}"
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Find and Prepare APK Output
        id: apk-path
        run: |
          mkdir -p build-output
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk build-output/AURA-RPM-debug.apk
            echo "apk_file=build-output/AURA-RPM-debug.apk" >> $GITHUB_OUTPUT
          elif [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk build-output/AURA-RPM-release.apk
            echo "apk_file=build-output/AURA-RPM-release.apk" >> $GITHUB_OUTPUT
          else
            echo "Locating APK in build folder..."
            find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/AURA-RPM-latest.apk \;
            echo "apk_file=build-output/AURA-RPM-latest.apk" >> $GITHUB_OUTPUT
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AURA-RPM-Android-APK
          path: build-output/*.apk
          retention-days: 30
